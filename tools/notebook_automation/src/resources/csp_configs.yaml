# Configuration for cloud-specific Databricks cluster attributes including spot instance and storage settings

databricks:
  aws_attributes:
    first_on_demand: 1
    availability: "SPOT_WITH_FALLBACK"
    zone_id: "auto"
    instance_profile_arn: null
    spot_bid_price_percent: 100
    ebs_volume_count: 1
    ebs_volume_size: 100
    ebs_volume_type: "GENERAL_PURPOSE_SSD"
  azure_attributes:
    first_on_demand: 1
    availability: "ON_DEMAND_AZURE"
    spot_bid_max_price: -1
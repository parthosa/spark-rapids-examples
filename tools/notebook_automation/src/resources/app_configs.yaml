# Default application configuration for Databricks cluster, notebook, and GitHub settings with single-node setup

cluster:
  name_prefix: "Notebook_Runner"
  default_config:
    num_workers: 0
    spark_version: "13.3.x-scala2.12"
    spark_conf:
      spark.master: "local[*, 4]"
      spark.databricks.cluster.profile: "singleNode"
    node_type_id: "m5d.xlarge"
    driver_node_type_id: "m5d.xlarge"
    ssh_public_keys: []
    custom_tags:
      ResourceClass: "SingleNode"
    spark_env_vars:
      PYSPARK_PYTHON: "/databricks/python3/bin/python3"
    autotermination_minutes: 120
    enable_elastic_disk: false
    init_scripts: []
    data_security_mode: "LEGACY_SINGLE_USER_STANDARD"
    runtime_engine: "STANDARD"
  creation_timeout_minutes: 20

notebook:
  run_prefix: "API_Notebook_Run"
  default_timeout_minutes: 20
  default_parameters: {}
  status_check_interval_seconds: 30

github:
  use_raw_content: true

databricks:
  workspace_url: ""
  token: ""

workspace:
  import_path: "/Workspace/Users"
  overwrite: true 